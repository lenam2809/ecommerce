global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@example.com"
  smtp_auth_username: "alerts@example.com"
  smtp_auth_password: "replace-me"

route:
  receiver: ops-all
  group_by:
    - alertname
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: ops-all
    slack_configs:
      - api_url: "https://hooks.slack.com/services/replace/me"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }} [{{ .CommonLabels.severity }}]"
        text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
    email_configs:
      - to: "ops@example.com"
        send_resolved: true
    telegram_configs:
      - bot_token: "000000000:replace-me"
        chat_id: 0
        send_resolved: true
        message: "{{ .CommonLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
