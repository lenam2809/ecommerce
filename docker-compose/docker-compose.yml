# =============================================================================
# Ecommerce Multi-Service Docker Compose
# =============================================================================
# Services:
#   - backend: .NET 8.0 Web API
#   - frontend-client: Next.js 15 Customer Website
#   - frontend-dashboard: Next.js 15 Admin Dashboard
#   - postgres: PostgreSQL Database
#   - redis: Redis Cache (optional)
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis Cache (Optional)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Elasticsearch (Search Service)
  # ===========================================================================
  elasticsearch:
    build:
      context: .
      dockerfile: elasticsearch.Dockerfile
    image: ecommerce-elasticsearch-icu:8.16.3
    container_name: ecommerce-elasticsearch
    restart: unless-stopped
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # Backend API (.NET 8.0)
  # ===========================================================================
  backend:
    build:
      context: ../apps/backend/Ecommerce
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Host=postgres;Database=ecommerce_db;Username=postgres;Password=yourpassword;}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING:-redis:6379}
      - CacheSettings__UseRedis=${USE_REDIS:-false}
      - CacheSettings__RedisConnection=${REDIS_CONNECTION_STRING:-redis:6379}
      - CacheSettings__DefaultExpirationMinutes=${CACHE_DEFAULT_EXPIRATION_MINUTES:-60}
      - CacheSettings__UserCacheDuration=${CACHE_USER_DURATION:-10}
      - CacheSettings__RoleCacheDuration=${CACHE_ROLE_DURATION:-30}
      - CacheSettings__PermissionCacheDuration=${CACHE_PERMISSION_DURATION:-60}
      - CacheSettings__ConfigCacheDuration=${CACHE_CONFIG_DURATION:-120}
      - CacheSettings__EntityCacheDuration=${CACHE_ENTITY_DURATION:-15}
      - Serilog__MinimumLevel__Default=${LOG_LEVEL_DEFAULT:-Information}
      - Serilog__MinimumLevel__Override__Microsoft=${LOG_LEVEL_MICROSOFT:-Warning}
      - Serilog__MinimumLevel__Override__System=${LOG_LEVEL_SYSTEM:-Warning}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-Ecommerce}
      - Jwt__Audience=${JWT_AUDIENCE:-EcommerceUsers}
      - Jwt__AccessTokenExpirationMinutes=${JWT_EXPIRATION:-60}
      - FileStorage__AppUrl=${FILE_STORAGE_APP_URL}
      - FileStorage__UploadFolder=${FILE_STORAGE_UPLOAD_FOLDER:-uploads}
      - AppUrl=${BACKEND_URL:-http://localhost:5000}
      - Elasticsearch__Uri=http://elasticsearch:9200
    volumes:
      - ../apps/backend/Ecommerce/Ecommerce.WebAPI/wwwroot/uploads:/app/wwwroot/uploads
    networks:
      - ecommerce-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/swagger/index.html" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Frontend Client (Next.js 15)
  # ===========================================================================
  frontend-client:
    build:
      context: ../apps/frontend/ecommerce-client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: ecommerce-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    networks:
      - ecommerce-network
    depends_on:
      - backend

  # ===========================================================================
  # Frontend Dashboard (Next.js 15)
  # ===========================================================================
  frontend-dashboard:
    build:
      context: ../apps/frontend/ecommerce-dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: ecommerce-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3001}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    networks:
      - ecommerce-network
    depends_on:
      - backend

# =============================================================================
# Networks
# =============================================================================
networks:
  ecommerce-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  backend_uploads:
