# =============================================================================
# Ecommerce Multi-Service Docker Compose
# =============================================================================
# Services:
#   - backend: .NET 8.0 Web API
#   - frontend-client: Next.js 15 Customer Website
#   - frontend-dashboard: Next.js 15 Admin Dashboard
#   - postgres: PostgreSQL Database
#   - redis: Redis Cache (optional)
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis Cache (Optional)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Elasticsearch (Search Service)
  # ===========================================================================
  elasticsearch:
    build:
      context: .
      dockerfile: elasticsearch.Dockerfile
    image: ecommerce-elasticsearch-icu:8.16.3
    container_name: ecommerce-elasticsearch
    restart: unless-stopped
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # Backend API (.NET 8.0)
  # ===========================================================================
  backend:
    build:
      context: ../apps/backend/Ecommerce
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Host=postgres;Database=ecommerce_db;Username=postgres;Password=yourpassword;}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING:-redis:6379}
      - CacheSettings__UseRedis=${USE_REDIS:-false}
      - CacheSettings__RedisConnection=${REDIS_CONNECTION_STRING:-redis:6379}
      - CacheSettings__DefaultExpirationMinutes=${CACHE_DEFAULT_EXPIRATION_MINUTES:-60}
      - CacheSettings__UserCacheDuration=${CACHE_USER_DURATION:-10}
      - CacheSettings__RoleCacheDuration=${CACHE_ROLE_DURATION:-30}
      - CacheSettings__PermissionCacheDuration=${CACHE_PERMISSION_DURATION:-60}
      - CacheSettings__ConfigCacheDuration=${CACHE_CONFIG_DURATION:-120}
      - CacheSettings__EntityCacheDuration=${CACHE_ENTITY_DURATION:-15}
      - Serilog__MinimumLevel__Default=${LOG_LEVEL_DEFAULT:-Information}
      - Serilog__MinimumLevel__Override__Microsoft=${LOG_LEVEL_MICROSOFT:-Warning}
      - Serilog__MinimumLevel__Override__System=${LOG_LEVEL_SYSTEM:-Warning}
      - Serilog__Retention__InformationDays=${LOG_RETENTION_INFORMATION_DAYS:-14}
      - Serilog__Retention__ErrorDays=${LOG_RETENTION_ERROR_DAYS:-90}
      - Serilog__Retention__PerformanceDays=${LOG_RETENTION_PERFORMANCE_DAYS:-30}
      - Observability__ServiceName=ecommerce-api
      - Observability__ServiceVersion=${APP_VERSION:-1.0.0}
      - Observability__OtlpEndpoint=http://jaeger:4317
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-Ecommerce}
      - Jwt__Audience=${JWT_AUDIENCE:-EcommerceUsers}
      - Jwt__AccessTokenExpirationMinutes=${JWT_EXPIRATION:-60}
      - Auth__TokenHashSecret=${AUTH_TOKEN_HASH_SECRET}
      - FileStorage__AppUrl=${FILE_STORAGE_APP_URL}
      - FileStorage__UploadFolder=${FILE_STORAGE_UPLOAD_FOLDER:-uploads}
      - AppUrl=${BACKEND_URL:-http://localhost:5000}
      - Elasticsearch__UseElasticsearch=true
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Elasticsearch__DefaultIndex=${ELASTICSEARCH_DEFAULT_INDEX:-products}
      - Elasticsearch__Username=${ELASTICSEARCH_USERNAME:-}
      - Elasticsearch__Password=${ELASTICSEARCH_PASSWORD:-}
      - Elasticsearch__RunStartupReindex=true
      - Elasticsearch__RunDailyReindex=true
      - Cors__AllowedOrigins__0=${FRONTEND_URL_1:-http://localhost:3000}
      - Cors__AllowedOrigins__1=${FRONTEND_URL_2:-http://localhost:3001}
      - CookieSettings__ForceSecure=true
      - AuthConfig__IncludeTokensInResponse=false
    volumes:
      - ../apps/backend/Ecommerce/Ecommerce.WebAPI/wwwroot/uploads:/app/wwwroot/uploads
    networks:
      - ecommerce-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Frontend Client (Next.js 15)
  # ===========================================================================
  frontend-client:
    build:
      context: ../apps/frontend/ecommerce-client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:5000/api}
    container_name: ecommerce-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:5000/api}
    networks:
      - ecommerce-network
    depends_on:
      - backend

  # ===========================================================================
  # Frontend Dashboard (Next.js 15)
  # ===========================================================================
  frontend-dashboard:
    build:
      context: ../apps/frontend/ecommerce-dashboard
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:5000/api}
    container_name: ecommerce-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3001}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:5000/api}
    networks:
      - ecommerce-network
    depends_on:
      - backend

  # ===========================================================================
  # Distributed Tracing
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ecommerce-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - ecommerce-network

  # ===========================================================================
  # Metrics, Alerting, and Dashboards
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ecommerce-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ecommerce-network
    depends_on:
      - backend
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ecommerce-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--config.expand-env"
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/replace/me}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-alerts@example.com}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-ops@example.com}
      - SMTP_SMARTHOST=${SMTP_SMARTHOST:-smtp.example.com:587}
      - SMTP_USERNAME=${SMTP_USERNAME:-alerts@example.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-replace-me}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-000000000:replace-me}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-0}
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:10.4.3
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ecommerce-network
    depends_on:
      - prometheus
      - jaeger

# =============================================================================
# Networks
# =============================================================================
networks:
  ecommerce-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  backend_uploads:
  prometheus_data:
  grafana_data:
