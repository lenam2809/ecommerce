name: Frontend Quality

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

jobs:
  quality:
    name: ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: ecommerce-client
            path: apps/frontend/ecommerce-client
          - name: ecommerce-dashboard
            path: apps/frontend/ecommerce-dashboard

    defaults:
      run:
        working-directory: ${{ matrix.app.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
