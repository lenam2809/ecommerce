services:
  # ===========================================================================
  # Backend API (.NET 8.0)
  # ===========================================================================
  - type: web
    name: ecommerce-backend
    runtime: docker
    dockerfilePath: apps/backend/Ecommerce/Dockerfile
    dockerContext: apps/backend/Ecommerce
    plan: free
    healthCheckPath: /swagger/index.html
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: ConnectionStrings__Redis
        fromService:
          type: keyvalue
          name: ecommerce-redis
          property: connectionString
      - key: CacheSettings__UseRedis
        value: "true"
      - key: Jwt__SecretKey
        generateValue: true
      - key: Jwt__Issuer
        value: Ecommerce
      - key: Jwt__Audience
        value: EcommerceUsers
      - key: Jwt__AccessTokenExpirationMinutes
        value: "60"
      - key: FileStorage__UploadFolder
        value: uploads # Khớp với mkdir -p /app/uploads trong Dockerfile
      - key: Elasticsearch__Uri
        sync: false
        placeholder: "https://your-elasticsearch-url:9243"
      - key: Elasticsearch__EnableSsl
        value: "true"

  # ===========================================================================
  # Managed Redis (Render Key Value)
  # ===========================================================================
  - type: keyvalue
    name: ecommerce-redis
    plan: free
    ipAllowList: []

databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce_db
    user: ecommerce_user
    postgresMajorVersion: 15
